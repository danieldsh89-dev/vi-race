name: Verificar recuperación D1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vi-race-writer
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.private == false && vars.VI_RACE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_TOKEN }}
      VI_RACE_RESTORE_DATABASE_ID: ${{ vars.VI_RACE_RESTORE_DATABASE_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run deploy:check
      - run: npx tsx scripts/restore-check-config.ts
      - run: node scripts/wrangler.mjs d1 migrations apply DB --remote --config .local/deployment/restore-wrangler.json
      - run: npx tsx scripts/verify-remote-store.ts
